<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Design Research — Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #0f0f12;
      --bg-card: #16161a;
      --bg-card-hover: #1c1c21;
      --bg-tag: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.06);
      --border-subtle: rgba(255,255,255,0.03);
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent: #818cf8;
      --accent-glow: rgba(129,140,248,0.15);
      --hot: #fb7185;
      --hot-glow: rgba(251,113,133,0.12);
      --tip: #34d399;
      --tip-glow: rgba(52,211,153,0.12);
      --radar: #c084fc;
      --radar-glow: rgba(192,132,252,0.12);
      --update: #60a5fa;
      --update-glow: rgba(96,165,250,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }



    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 4rem 0 3rem;
      text-align: center;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .logo { font-size: 2.5rem; margin-bottom: 1.25rem; display: inline-block; filter: grayscale(20%); }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .subtitle {
      color: var(--text-tertiary);
      font-size: 0.9rem;
      font-weight: 400;
      max-width: 420px;
      margin: 0 auto;
    }

    .meta-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
    }

    .meta-bar .value { color: var(--text-secondary); font-weight: 500; }

    .day-section { margin: 3rem 0; }

    .day-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .day-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .day-header .line { flex: 1; height: 1px; background: var(--border); }

    .day-header .count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-tertiary);
      background: var(--bg-tag);
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      white-space: nowrap;
    }

    .category { margin-bottom: 1.75rem; }

    .category-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-xs);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .category-label.hot { color: var(--hot); background: var(--hot-glow); }
    .category-label.tip { color: var(--tip); background: var(--tip-glow); }
    .category-label.radar { color: var(--radar); background: var(--radar-glow); }
    .category-label.update { color: var(--update); background: var(--update-glow); }

    .category-label.video { color: #f472b6; background: rgba(244,114,182,0.12); }

    .tag.yt {
      color: #f472b6;
      background: rgba(244,114,182,0.1);
    }

    .finding {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 0.75rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .finding:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-1px);
    }

    .finding-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .finding h4 { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; }

    .finding h4 a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .finding h4 a:hover { color: var(--accent); }

    .finding .desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 0.75rem;
    }

    .finding-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .source-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-tertiary);
      margin-bottom: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-url a {
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .source-url a:hover { color: var(--accent); }

    /* ── Summary ── */
    .summary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.5rem;
      margin: 2.5rem 0;
    }

    .summary h3 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
      margin-bottom: 1rem;
    }

    .summary p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 0.75rem;
    }

    .summary a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .summary a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }

    .summary .highlight {
      color: var(--text-primary);
      font-weight: 600;
    }

    .tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-xs);
      background: var(--bg-tag);
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
    }

    .verdict {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.65rem;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .verdict.try { color: var(--tip); background: var(--tip-glow); }
    .verdict.watch { color: var(--radar); background: var(--radar-glow); }
    .verdict.skip { color: var(--hot); background: var(--hot-glow); }

    footer {
      text-align: center;
      padding: 3rem 0 4rem;
      color: var(--text-tertiary);
      font-size: 0.75rem;
    }

    /* ── Bookmark Toggle Bar ── */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .filter-bar button {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.35rem 1.1rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-bar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .filter-bar button:hover:not(.active) {
      border-color: rgba(255,255,255,0.15);
      color: var(--text-secondary);
    }

    /* ── Bookmark Icon ── */
    .verdict-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.15rem;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.2s ease;
      flex-shrink: 0;
      line-height: 1;
    }
    .bookmark-btn:hover { color: rgba(255, 255, 255, 0.6); }
    .bookmark-btn.active {
      color: var(--accent);
      filter: drop-shadow(0 0 6px var(--accent));
    }

    /* ── Collapsible Day Sections ── */
    .day-header {
      cursor: pointer;
      user-select: none;
    }
    .day-header .chevron {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    .day-header .chevron.collapsed { transform: rotate(0deg); }
    .day-header .chevron.expanded { transform: rotate(90deg); }

    .day-content {
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 1;
    }
    .day-content.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    /* Force collapsed appearance for older sections */
    .auto-collapsed .summary,
    .auto-collapsed .category,
    .auto-collapsed .finding {
      display: none !important;
    }



    @media (max-width: 640px) {
      header { padding: 3rem 0 2rem; }
      header h1 { font-size: 1.4rem; }
      .meta-bar { flex-direction: column; gap: 0.5rem; }
      .finding { padding: 1rem 1.15rem; }
      .finding-header { flex-direction: column; gap: 0.5rem; }
      .finding-footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <div class="logo">🦅</div>
    <h1>AI Design Research</h1>
    <p class="subtitle">Daily intelligence on AI tools, workflows, and techniques that accelerate design</p>
    <div class="meta-bar">
      <div>findings <span class="value" id="total-count">334</span></div>
      <div>since <span class="value" id="start-date">2026-02-24</span></div>
      <div>updated <span class="value" id="last-update">2026-03-22</span></div>
    </div>
  </header>
